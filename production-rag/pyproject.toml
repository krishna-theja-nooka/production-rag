[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag"
version = "0.2.0"
description = "A local-first RAG reference application with evidence, evaluation, and deployment guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3", "pypdf>=5,<7"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.3,<6"]
llm = ["transformers>=4.45,<5", "torch>=2.6,<3", "safetensors>=0.4,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[project.scripts]
rag = "production_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
